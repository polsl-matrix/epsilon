name: Continuous-Integration
on: [push, pull_request]
jobs:
  Verify-Debug-Build-And-Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install GCC 15 and Clang-Tidy 18
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-15 g++-15 clang-tidy-18 -y
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          dir: '${{ github.workspace }}/Qt'
      - name: Save Qt's path to .env
        run: echo QT_PATH="$QT_ROOT_DIR"
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Clear PKG_CONFIG_PATH
        shell: bash
        run: echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV
      - name: Install Conan
        uses: conan-io/setup-conan@v1
      - name: Install python-dotenv
        run: pip install python-dotenv
      - name: Install Conan dependencies
        run: conan install . -s build_type=Debug --build=missing
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.x'
      - name: Configure CMake
        env:
          CC: gcc-15
          CXX: g++-15
        run: >
          rm -rf build
        
          # Configure completely from scratch
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18;--header-filter=src/.*"
      - name: Build the CMake preset
        run: cmake --preset conan-debug .
      - name: Build the project
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --build --preset conan-debug
      - name: Run tests
        env:
          CC: gcc-15
          CXX: g++-15
        run: cd build/Debug && ctest
  Verify-Release-Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install GCC 15 and Clang-Tidy 18
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-15 g++-15 clang-tidy-18 -y
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          dir: '${{ github.workspace }}/Qt'
      - name: Save Qt's path to .env
        run: echo QT_PATH="$QT_ROOT_DIR"
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Clear PKG_CONFIG_PATH
        shell: bash
        run: echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV
      - name: Install Conan
        uses: conan-io/setup-conan@v1
      - name: Install python-dotenv
        run: pip install python-dotenv
      - name: Install Conan dependencies
        run: conan install . -s build_type=Release --build=missing
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.x'
      - name: Configure CMake
        env:
          CC: gcc-15
          CXX: g++-15
        run: >
          rm -rf build
        
          # Configure completely from scratch
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18;--header-filter=src/.*"
      - name: Build the CMake preset
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset conan-release .
      - name: Build the project
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --build --preset conan-release
  Check-Formatting-And-Linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install GCC 15 and Clang-Tidy 18
        run: |
          sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
          sudo apt update
          sudo apt install gcc-15 g++-15 clang-tidy-18 -y
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.0
          dir: '${{ github.workspace }}/Qt'
      - name: Save Qt's path to .env
        run: echo QT_PATH="$QT_ROOT_DIR"
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Clear PKG_CONFIG_PATH
        shell: bash
        run: echo "PKG_CONFIG_PATH=" >> $GITHUB_ENV
      - name: Install Conan
        uses: conan-io/setup-conan@v1
      - name: Install python-dotenv
        run: pip install python-dotenv
      - name: Install Conan dependencies
        run: conan install . -s build_type=Release --build=missing
      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.23.x'
      - name: Configure CMake
        env:
          CC: gcc-15
          CXX: g++-15
        run: >
          rm -rf build
        
          # Configure completely from scratch
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_CXX_CLANG_TIDY="clang-tidy-18;--header-filter=src/.*"
      - name: Build the CMake preset
        env:
          CC: gcc-15
          CXX: g++-15
        run: cmake --preset conan-release .
      - name: Run clang-tidy
        uses: cpp-linter/cpp-linter-action@v2
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: 'file'
          tidy-checks: ''
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' }}
      - name: Fail fast?!
        if: steps.linter.outputs.checks-failed > 0
        run: exit 1
